name: please-payment-agent
permissions:
  contents: read
  actions: read

on:
  push:
    branches: [ develop, main ]
    tags: ['v*.*.*']

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  build1:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "please-payment-agent" ]
    outputs:
      imageTag: ${{ steps.prep.outputs.version }}
      autoDeployEnv: ${{ steps.prep.outputs.deployEnv }}
      autoDeployBranch: ${{ steps.prep.outputs.autoDeployBranch }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v2

    - name: Prepare
      id: prep
      run: |
        DOCKER_IMAGE=${{matrix.service}}
        GCR_IMAGE=asia-southeast1-docker.pkg.dev/its-artifact-commons/please-payment/${{matrix.service}}
        VERSION=latest
        GIT_HASH=$(git rev-parse --short "$GITHUB_SHA")
        ENV=dev
        DEPLOYMENT_BRANCH=development
        SERVICE=${{matrix.service}}

        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          ENV=prod
          DEPLOYMENT_BRANCH=production
        elif [[ $GITHUB_REF == refs/heads/* ]]; then
          BRANCH=$(echo ${GITHUB_REF#refs/heads/} | sed -r 's#/+#-#g')
          VERSION=$BRANCH-$GIT_HASH
        fi

        TAGS="${DOCKER_IMAGE}:${VERSION}"
        GCR_TAGS="${GCR_IMAGE}:${VERSION}"

        if [[ $VERSION =~ ^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
          MINOR=${VERSION%.*}
          MAJOR=${MINOR%.*}
          TAGS="$TAGS,${DOCKER_IMAGE}:${MINOR},${DOCKER_IMAGE}:${MAJOR},${DOCKER_IMAGE}:latest"
        elif [ "${{ github.event_name }}" = "push" ]; then
          TAGS="$TAGS,${DOCKER_IMAGE}:sha-${GITHUB_SHA::8}"
        fi

        DOCKERFILE=Dockerfile

        # Source ref this image is built from — baked into the image so GET /status
        # can report it. A tag build reports the tag; a branch build, the branch.
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          SOURCE_REF=${GITHUB_REF#refs/tags/}
        else
          SOURCE_REF=${GITHUB_REF#refs/heads/}
        fi
        BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        echo ::set-output name=tags::${TAGS}
        echo ::set-output name=gcr_tags::${GCR_TAGS}
        echo ::set-output name=version::${VERSION}
        echo ::set-output name=deployEnv::${ENV}
        echo ::set-output name=autoDeployBranch::${DEPLOYMENT_BRANCH}
        echo ::set-output name=dockerFile::${DOCKERFILE}
        echo ::set-output name=sourceRef::${SOURCE_REF}
        echo ::set-output name=buildTime::${BUILD_TIME}

    - name: Slack notification start
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        fields: repo,message,commit,author,ref,workflow # selectable (default: repo,message)
        text: "Start building [${{matrix.service}}] [${{ steps.prep.outputs.version }}]..."
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_URL }} # required

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v0'
      with:
        credentials_json: '${{ secrets.GCR_KEY }}'

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v1
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: GCR Authen
      run: |
        # Set up docker to authenticate
        # via gcloud command-line tool.
        gcloud auth configure-docker asia-southeast1-docker.pkg.dev

    - name: Build and push images
      uses: docker/build-push-action@v3
      with:
        file: ${{ steps.prep.outputs.dockerFile }}
        push: true
        load: false
        tags: ${{ steps.prep.outputs.gcr_tags }}
        # GIT_* stamp the image so GET /status reports the deployed commit/branch
        # instead of "unknown" — without these a running pod cannot be matched
        # back to its source.
        build-args: |
          version=${{ steps.prep.outputs.version }}
          GIT_COMMIT=${{ github.sha }}
          GIT_BRANCH=${{ steps.prep.outputs.sourceRef }}
          BUILD_TIME=${{ steps.prep.outputs.buildTime }}

    - name: Slack notification end
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        fields: repo,message,commit,author,ref,workflow # selectable (default: repo,message)
        text: "Done building [${{matrix.service}}] [${{ steps.prep.outputs.version }}] with status [${{job.status}}]"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_URL }} # required

  deploy:
    needs: [ build1 ]
    runs-on: ubuntu-latest
    steps:

    - name: Slack notification start
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        fields: repo,message,commit,author,ref,workflow # selectable (default: repo,message)
        text: "Start deploying [please-payment-agent] [${{ needs.build1.outputs.imageTag }}] to [${{ needs.build1.outputs.autoDeployEnv }}]..."
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_URL }} # required

    # Post-deploy check: curl the live GET /status and print its `build` block so
    # the run log shows exactly which commit/branch is serving. Warns (does not
    # fail) on mismatch because deployment is not yet automated in this job.
    # Requires repo variable STATUS_URL (e.g. https://worker.example.com/status)
    # and secret HTTP_API_KEY; skipped silently until STATUS_URL is set.
    - name: Verify deployed build via /status
      if: ${{ vars.STATUS_URL != '' }}
      run: |
        BUILD=$(curl -fsS -u "${{ vars.HTTP_API_USER || 'api' }}:${{ secrets.HTTP_API_KEY }}" "${{ vars.STATUS_URL }}" | jq .build)
        echo "deployed build info:"
        echo "$BUILD" | jq .
        DEPLOYED=$(echo "$BUILD" | jq -r .commit)
        if [ "$DEPLOYED" = "$GITHUB_SHA" ]; then
          echo "OK: deployed commit matches $GITHUB_SHA (branch $(echo "$BUILD" | jq -r .branch))"
        else
          echo "::warning::deployed commit is $DEPLOYED, expected $GITHUB_SHA — old image still running?"
        fi

    - name: Slack notification end
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        fields: repo,message,commit,author,ref,workflow # selectable (default: repo,message)
        text: "Done deploying [please-payment-agent] [${{ needs.build1.outputs.imageTag }}] to [${{ needs.build1.outputs.autoDeployEnv }}]"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_URL }} # required
